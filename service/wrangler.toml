name = "rootout-keys"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "KEYS"
# Placeholder: create the namespace with `wrangler kv namespace create KEYS` and paste its id at deploy time.
id = "REPLACE_AT_DEPLOY"

# Per-IP limit for /renew and /trial (5 requests per 60 s); protects the KV write quota.
[[unsafe.bindings]]
name = "RATE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[triggers]
crons = ["17 3 * * *"]

[vars]
PATREON_URL = "https://www.patreon.com/REPLACE_AT_DEPLOY"
ALERT_REPO = "shiva2021/rootout"
PUBLIC_ORIGIN = "https://REPLACE_AT_DEPLOY"
