version: 2
project_name: rootout

before:
  hooks:
    - go mod download

builds:
  - id: rootout
    main: ./cmd/rootout
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version=v{{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, CHANGELOG.md, LICENSE]

checksum:
  name_template: checksums.txt

# No changelog.disable: in 2.18.3 it skips the pipe that loads --release-notes,
# leaving the release body empty (v0.4.0). With --release-notes set, the pipe
# uses that file and never builds a commit-based changelog.

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: shiva2021
    name: rootout
  prerelease: auto

homebrew_casks:
  - name: rootout
    binaries: [rootout]
    homepage: https://github.com/shiva2021/rootout
    description: Uninstall macOS apps completely and scan VS Code-family extensions for malicious behaviour
    directory: Casks
    skip_upload: auto
    repository:
      owner: shiva2021
      name: homebrew-rootout
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Shivang Chaturvedi
      email: shiva.chaturvedi91@gmail.com
    caveats: |
      rootout is not code-signed. The quarantine attribute is cleared on install.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/rootout"]
          end
