version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - unconvert
  exclusions:
    rules:
      # G304: the tool's job is to read and remove paths chosen at runtime;
      # every such path passes internal/safety first.
      - linters: [gosec]
        text: "G304"
      # Test fixtures create world-readable temp files on purpose, and
      # restore directory modes they changed to simulate denied access.
      # G204: tests run repo scripts with table-driven arguments.
      - linters: [gosec]
        path: (_test\.go|internal/testutil/)
        text: "G(30[126]|204)"
